services:
  # ----------------------------------------
  # Backend API
  # ----------------------------------------
  - type: web
    name: talentmatch-api-demo
    runtime: python
    region: frankfurt
    plan: free

    rootDir: .

    buildCommand: pip install -r requirements.txt

    preDeployCommand: alembic upgrade head

    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_NAME
        value: TalentMatch AI

      - key: DEBUG
        value: "false"

      - key: LLM_PROVIDER
        value: groq

      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5

      - key: DATABASE_URL
        fromDatabase:
          name: talentmatch-db-demo
          property: connectionString

      - key: GROQ_API_KEY
        sync: false

      - key: ANONYMOUS_SCREENING_SECRET
        generateValue: true

      - key: FRONTEND_URL
        value: https://talentmatch-frontend-demo.onrender.com


  # ----------------------------------------
  # React / Vite Frontend
  # ----------------------------------------
  - type: web
    name: talentmatch-frontend-demo
    runtime: static

    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://talentmatch-api-demo.onrender.com

    routes:
      - type: rewrite
        source: /*
        destination: /index.html


# ----------------------------------------
# PostgreSQL
# ----------------------------------------
databases:
  - name: talentmatch-db-demo
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"