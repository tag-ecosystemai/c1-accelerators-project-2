services:
  postgres:
    image: postgres:16
    container_name: talentmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - talentmatch_postgres_data:/var/lib/postgresql/data

volumes:
  talentmatch_postgres_data:
